<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Simulado Personalizado Detran-MG</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        color: #222;
        min-height: 100vh;
      }

      header {
        background-color: #222;
        color: white;
        padding: 20px;
        text-align: center;
      }

      header h1 {
        font-size: 24px;
      }

      main {
        width: 90%;
        max-width: 800px;
        margin: 30px auto;
      }

      .tela {
        background-color: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .inicio {
        text-align: center;
      }

      .inicio h2 {
        margin-bottom: 15px;
      }

      .inicio p {
        margin-bottom: 25px;
        line-height: 1.5;
      }

      .opcoes {
        display: flex;
        flex-direction: column;
        gap: 15px;
        margin-top: 30px;
      }

      button {
        border: none;
        border-radius: 6px;
        padding: 14px 20px;
        font-size: 16px;
        cursor: pointer;
      }

      .btn-principal {
        background-color: #222;
        color: white;
      }

      .btn-principal:hover {
        background-color: #444;
      }

      .btn-secundario {
        background-color: #555;
        color: white;
      }

      .btn-secundario:hover {
        background-color: #333;
      }

      @media (max-width: 600px) {
        main {
          width: 94%;
          margin: 20px auto;
        }

        .tela {
          padding: 20px;
        }

        header h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Simulado Personalizado Detran-MG</h1>
    </header>

    <main>
      <section class="tela inicio">
        <h2>Simulado de Legislação de Trânsito</h2>

        <p>Escolha o nível do simulado que deseja realizar.</p>

        <div class="opcoes">
          <button
            class="btn-principal"
            onclick="window.location.href = 'simulado-1.html'"
          >
            Simulado 1
          </button>

          <button
            class="btn-secundario"
            onclick="window.location.href = 'simulado-2.html'"
          >
            Simulado 2
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
